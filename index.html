<!DOCTYPE html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#0b3d2e'><title>Meu Dinheiro</title><style>:root{--g:#0b3d2e;--g2:#14a76c;--bg:#f4f7f5;--c:#fff;--t:#16221d;--m:#6b7a73;--r:#e5484d;--b:#e3e9e5}*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{background:var(--bg);color:var(--t);padding-bottom:90px}.wrap{max-width:560px;margin:0 auto;padding:16px}header{background:var(--g);color:#fff;padding:22px 16px 70px}header .wrap{padding:0}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:18px}.ghost{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}.lbl{opacity:.8;font-size:13px;margin-top:18px}.bal{font-size:38px;font-weight:800;margin-top:4px}.card{background:var(--c);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.pull{margin-top:-52px}.row{display:flex;gap:10px}.row>*{flex:1}.sm{font-size:12px;color:var(--m)}.in{color:var(--g2);font-weight:700}.out{color:var(--r);font-weight:700}h2{font-size:16px;margin-bottom:10px}input,select{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font-size:16px;background:#fff;margin-top:8px}button.p{width:100%;background:var(--g2);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;margin-top:12px;cursor:pointer}.seg{display:flex;background:var(--bg);border-radius:10px;padding:4px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--m)}.seg button.on{background:#fff;color:var(--t);box-shadow:0 1px 2px rgba(0,0,0,.1)}.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b)}.tx:last-child{border:0}.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}.tx .d{flex:1;min-width:0}.tx .d b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.x{background:none;border:0;color:var(--m);font-size:18px;cursor:pointer}.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g2)}.tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b);font-size:14px;line-height:1.4}.tip:last-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:8px 0 12px}nav button{background:none;border:0;font-size:12px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 14px}nav button span{font-size:22px}nav button.on{color:var(--g2);font-weight:700}.fab{position:fixed;right:18px;bottom:78px;width:56px;height:56px;border-radius:50%;background:var(--g2);color:#fff;border:0;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}.hide{display:none}.empty{text-align:center;color:var(--m);padding:24px 0;font-size:14px}.leg{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.mo{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.mo button{background:#fff;border:1px solid var(--b);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:9}.sheet>div{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}</style></head><body><header><div class='wrap'><div class='top'><div class='logo'>💚 Meu Dinheiro</div><button class='ghost' onclick='csv()'>Exportar</button></div><div class='lbl'>Saldo atual</div><div class='bal' id='bal'>R$ 0,00</div></div></header><div class='wrap pull'><div class='card'><div class='row'><div><div class='sm'>Entradas do mês</div><div class='in' id='tin'>R$ 0,00</div></div><div><div class='sm'>Saídas do mês</div><div class='out' id='tout'>R$ 0,00</div></div></div></div><div class='mo'><button onclick='mv(-1)'>‹</button><b id='mlabel'></b><button onclick='mv(1)'>›</button></div><main id='main'></main></div><button class='fab' onclick='openAdd()'>+</button><nav><button id='n0' onclick='tab(0)'><span>🏠</span>Início</button><button id='n1' onclick='tab(1)'><span>📊</span>Gastos</button><button id='n2' onclick='tab(2)'><span>🎯</span>Metas</button><button id='n3' onclick='tab(3)'><span>💡</span>Dicas</button></nav><div id='modal'></div><script>var CATS={moradia:['🏠','Moradia'],mercado:['🛒','Mercado'],comida:['🍔','Restaurantes'],transporte:['🚗','Transporte'],saude:['💊','Saúde'],lazer:['🎬','Lazer'],compras:['🛍️','Compras'],assinaturas:['📺','Assinaturas'],educacao:['📚','Educação'],contas:['💡','Contas'],outros:['📦','Outros'],salario:['💰','Salário'],extra:['➕','Renda extra']};var COL=['#14a76c','#3b82f6','#f59e0b','#e5484d','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b'];var S=JSON.parse(localStorage.getItem('md')||'null')||{tx:[],lim:{},ini:0,sal:0,setup:false};var cur=new Date();cur.setDate(1);var T=0,ty='out';function save(){localStorage.setItem('md',JSON.stringify(S))}function R(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function mtx(){var k=ym(cur);return S.tx.filter(function(t){return t.d.slice(0,7)==k}).sort(function(a,b){return b.d<a.d?-1:1})}function sum(a,t){return a.filter(function(x){return x.t==t}).reduce(function(s,x){return s+x.v},0)}function mv(n){cur.setMonth(cur.getMonth()+n);render()}function tab(n){T=n;render()}function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function render(){var all=S.ini+sum(S.tx,'in')-sum(S.tx,'out');document.getElementById('bal').textContent=R(all);var m=mtx();document.getElementById('tin').textContent=R(sum(m,'in'));document.getElementById('tout').textContent=R(sum(m,'out'));document.getElementById('mlabel').textContent=cur.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});for(var i=0;i<4;i++)document.getElementById('n'+i).className=i==T?'on':'';var h=[home,gastos,metas,dicas][T](m);document.getElementById('main').innerHTML=h}function byCat(m){var o={};m.filter(function(x){return x.t=='out'}).forEach(function(x){o[x.c]=(o[x.c]||0)+x.v});return Object.keys(o).map(function(k){return[k,o[k]]}).sort(function(a,b){return b[1]-a[1]})}function home(m){var h='<div class="card"><h2>Movimentações</h2>';if(!m.length)h+='<div class="empty">Nada por aqui ainda.<br>Toque no + para lançar sua primeira entrada ou saída.</div>';m.forEach(function(x){var c=CATS[x.c]||CATS.outros;h+='<div class="tx"><div class="ic">'+c[0]+'</div><div class="d"><b>'+esc(x.n||c[1])+'</b><span class="sm">'+c[1]+' · '+x.d.split('-').reverse().join('/')+'</span></div><div class="'+(x.t=='in'?'in':'out')+'">'+(x.t=='in'?'+':'-')+R(x.v)+'</div><button class="x" onclick="del('+x.id+')">×</button></div>'});return h+'</div>'}function gastos(m){var cs=byCat(m),tot=sum(m,'out');var h='<div class="card"><h2>Para onde seu dinheiro foi</h2>';if(!cs.length)return h+'<div class="empty">Sem gastos neste mês.</div></div>';var r=70,c=2*Math.PI*r,off=0,svg='<svg viewBox="0 0 200 200" width="200" style="display:block;margin:auto"><g transform="rotate(-90 100 100)">';cs.forEach(function(x,i){var l=x[1]/tot*c;svg+='<circle cx="100" cy="100" r="'+r+'" fill="none" stroke="'+COL[i%10]+'" stroke-width="30" stroke-dasharray="'+l+' '+(c-l)+'" stroke-dashoffset="'+(-off)+'"/>';off+=l});svg+='</g><text x="100" y="96" text-anchor="middle" font-size="12" fill="#6b7a73">Total</text><text x="100" y="116" text-anchor="middle" font-size="16" font-weight="700">'+R(tot)+'</text></svg>';h+=svg;cs.forEach(function(x,i){var c2=CATS[x[0]]||CATS.outros;h+='<div class="leg"><span><i class="dot" style="background:'+COL[i%10]+'"></i>'+c2[0]+' '+c2[1]+'</span><b>'+R(x[1])+' <span class="sm">'+Math.round(x[1]/tot*100)+'%</span></b></div>'});return h+'</div>'}function metas(m){var g={};m.filter(function(x){return x.t=='out'}).forEach(function(x){g[x.c]=(g[x.c]||0)+x.v});var h='<div class="card"><h2>Limites por categoria</h2><div class="sm">Defina quanto quer gastar por mês. Avisamos quando chegar perto.</div>';Object.keys(CATS).filter(function(k){return k!='salario'&&k!='extra'}).forEach(function(k){var l=S.lim[k]||0,v=g[k]||0,p=l?Math.min(100,v/l*100):0,col=p>=100?'var(--r)':p>=80?'#f59e0b':'var(--g2)';h+='<div style="margin-top:14px"><div class="leg" style="margin:0"><span>'+CATS[k][0]+' '+CATS[k][1]+'</span><span class="sm">'+R(v)+(l?' de '+R(l):'')+'</span></div><div class="bar"><i style="width:'+p+'%;background:'+col+'"></i></div><input type="number" inputmode="decimal" placeholder="Limite mensal (R$)" value="'+(l||'')+'" onchange="setLim(\''+k+'\',this.value)"></div>'});return h+'</div>'}function setLim(k,v){S.lim[k]=parseFloat(v)||0;save();render()}function dicas(m){var ti=sum(m,'in'),to=sum(m,'out'),a=[],cs=byCat(m);var base=ti||S.sal;if(!m.length)a.push(['👋','Lance suas entradas e saídas durante alguns dias. Quanto mais você registra, mais precisas ficam as dicas.']);if(base&&to>base)a.push(['🚨','Você já gastou mais do que entrou neste mês ('+R(to-base)+' a mais). Corte primeiro o que não é essencial.']);else if(base&&to>base*.8)a.push(['⚠️','Você já usou '+Math.round(to/base*100)+'% da sua renda do mês. Segure os gastos até o próximo salário.']);if(base&&ti&&ti-to>=base*.2)a.push(['🎉','Você está guardando '+Math.round((ti-to)/ti*100)+'% da renda. Excelente. Mande esse valor para uma reserva logo que entra.']);cs.forEach(function(x){var l=S.lim[x[0]];if(l&&x[1]>l)a.push(['🚨','Você estourou o limite de '+CATS[x[0]][1]+' em '+R(x[1]-l)+'.']);else if(l&&x[1]>l*.8)a.push(['⚠️',CATS[x[0]][1]+' já está em '+Math.round(x[1]/l*100)+'% do limite.'])});if(cs.length&&to&&cs[0][1]/to>.4)a.push(['🔍','Quase metade dos seus gastos está em '+CATS[cs[0][0]][1]+'. Vale revisar essa categoria primeiro, é onde um corte rende mais.']);var as=m.filter(function(x){return x.c=='assinaturas'}).length;if(as>=3)a.push(['📺','Você tem '+as+' lançamentos de assinaturas. Cancele as que você não usou no último mês.']);a.push(['📏','Regra 50/30/20: até 50% da renda para o essencial, 30% para o que você quer e 20% para guardar.']);a.push(['🛡️','Meta de reserva de emergência: de 3 a 6 meses do seu custo de vida em uma conta com liquidez.']);a.push(['⏳','Antes de compras grandes e por impulso, espere 24 horas. Muita vontade passa sozinha.']);a.push(['💳','Pague o total da fatura do cartão. Os juros do rotativo estão entre os mais altos que existem.']);a.push(['📅','Defina um dia da semana para abrir o app e conferir tudo. Cinco minutos já fazem diferença.']);var h='<div class="card"><h2>Dicas para você</h2>';a.forEach(function(x){h+='<div class="tip"><span>'+x[0]+'</span><span>'+x[1]+'</span></div>'});return h+'</div>'}function del(id){if(confirm('Apagar este lançamento?')){S.tx=S.tx.filter(function(x){return x.id!=id});save();render()}}function openAdd(){ty='out';var o=Object.keys(CATS).map(function(k){return'<option value="'+k+'">'+CATS[k][0]+' '+CATS[k][1]+'</option>'}).join('');var d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');document.getElementById('modal').innerHTML='<div class="sheet" onclick="if(event.target==this)closeM()"><div><h2>Novo lançamento</h2><div class="seg"><button id="sout" class="on" onclick="setTy(\'out\')">Saída</button><button id="sin" onclick="setTy(\'in\')">Entrada</button></div><input id="av" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)"><input id="an" placeholder="Descrição (ex: Mercado)"><select id="ac">'+o+'</select><input id="ad" type="date" value="'+ds+'"><button class="p" onclick="add()">Salvar</button></div></div>';document.getElementById('ac').value='mercado'}function setTy(t){ty=t;document.getElementById('sout').className=t=='out'?'on':'';document.getElementById('sin').className=t=='in'?'on':'';document.getElementById('ac').value=t=='in'?'salario':'mercado'}function closeM(){document.getElementById('modal').innerHTML=''}function add(){var v=parseFloat(document.getElementById('av').value);if(!(v>0)){alert('Digite um valor maior que zero.');return}var d=document.getElementById('ad').value;S.tx.push({id:Date.now(),t:ty,v:Math.round(v*100)/100,n:document.getElementById('an').value.trim(),c:document.getElementById('ac').value,d:d});if(d){var p=d.split('-');cur=new Date(+p[0],+p[1]-1,1)}save();closeM();T=0;render()}function csv(){var l=['Data;Tipo;Categoria;Descricao;Valor'];S.tx.slice().sort(function(a,b){return a.d<b.d?-1:1}).forEach(function(x){l.push([x.d,x.t=='in'?'Entrada':'Saida',(CATS[x.c]||CATS.outros)[1],'"'+(x.n||'').replace(/"/g,'')+'"',String(x.v).replace('.',',')].join(';'))});var b=new Blob(['\ufeff'+l.join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meu-dinheiro.csv';a.click()}function setup(){document.getElementById('modal').innerHTML='<div class="sheet"><div><h2>Bem-vindo 👋</h2><div class="sm">Dois dados para começar. Tudo fica salvo só no seu aparelho.</div><input id="s1" type="number" inputmode="decimal" placeholder="Quanto você tem na conta hoje? (R$)"><input id="s2" type="number" inputmode="decimal" placeholder="Seu salário mensal (R$)"><button class="p" onclick="fin()">Começar</button></div></div>'}function fin(){S.ini=parseFloat(document.getElementById('s1').value)||0;S.sal=parseFloat(document.getElementById('s2').value)||0;S.setup=true;save();closeM();render()}render();if(!S.setup)setup();</script></body></html>
